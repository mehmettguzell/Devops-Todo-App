name: build and registry push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Onceki release tag'ini bulmak icin tum gecmis + tag'ler gerekli.
          fetch-depth: 0

      - name: resolve previous release tag
        id: prev
        run: |
          current_tag="${GITHUB_REF_NAME}"
          # `|| true`: GitHub run adimlarini `bash -eo pipefail` ile calistiriyor.
          # Tek tag varsa grep bos donup 1 ile cikar, ayrica head ilk satirdan
          # sonra pipe'i kapatinca git SIGPIPE (141) alabilir - ikisi de asagidaki
          # "ilk commit'e dus" yedegine hic sira gelmeden adimi patlatirdi.
          prev_tag=$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n1 || true)
          if [ -z "$prev_tag" ]; then
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "base=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: filter paths changed since previous release
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          base: ${{ steps.prev.outputs.base }}
          ref: ${{ github.ref }}
          filters: |
            backend:
              - 'todo-api/backend/**'
            frontend:
              - 'todo-api/frontend/**'

      # Matrisi burada uretiyoruz: degismeyen imaj icin matris girdisi hic
      # olusmadigindan runner da ayaga kalkmiyor. Onceki halde her iki job da
      # baslayip (kuyruk + runner boot + checkout) sadece "skipping" yaziyordu.
      - name: build matrix
        id: matrix
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          items=""
          if [ "$BACKEND" = "true" ]; then
            items='{"image":"backend","context":"todo-api/backend"}'
          fi
          if [ "$FRONTEND" = "true" ]; then
            if [ -n "$items" ]; then
              items="${items},"
            fi
            items="${items}"'{"image":"frontend","context":"todo-api/frontend"}'
          fi
          value="[${items}]"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "build matrix: $value"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: set up docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to ghcr
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.image == 'frontend' && format('VITE_API_BASE_URL={0}', vars.VITE_API_BASE_URL) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
