name: deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build and registry push"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # build-push.yml only rebuilds an image (and its `latest` tag) when that
          # service actually changed, so backend/frontend don't share one version in
          # lockstep — `latest` is the only tag guaranteed to exist for whichever
          # service(s) this run touched. `set -e` ensures a failed pull/up aborts the
          # script instead of falling through to the harmless final prune command,
          # which would otherwise report SSM/Actions status as Success either way.
          #
          # docker-compose.yml is rewritten from the repo on every run so the server
          # self-heals if /opt/todo-app is ever lost. .env holds real DB credentials,
          # so instead of being embedded here it's fetched by the *server's own* IAM
          # role from SSM Parameter Store (/todo-app/env-file, SecureString) — the
          # value never passes through this GitHub Actions run at all.
          compose_b64=$(base64 -w0 todo-api/docker/docker-compose.yml)

          params=$(jq -n --arg compose "$compose_b64" '{
            commands: [
              "set -e",
              "mkdir -p /opt/todo-app",
              ("echo " + $compose + " | base64 -d > /opt/todo-app/docker-compose.yml"),
              "aws ssm get-parameter --name /todo-app/env-file --with-decryption --region eu-north-1 --query Parameter.Value --output text > /opt/todo-app/.env",
              "chmod 600 /opt/todo-app/.env",
              "cd /opt/todo-app",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -f"
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$params" \
            --comment "Deploy ${{ github.event.workflow_run.head_branch }}" \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $command_id"

          status="Pending"
          for _ in $(seq 1 30); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          [ "$status" = "Success" ]
