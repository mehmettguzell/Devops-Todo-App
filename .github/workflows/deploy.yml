name: deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build and registry push"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          # build-push.yml only rebuilds an image (and its `latest` tag) when that
          # service actually changed, so backend/frontend don't share one version in
          # lockstep — `latest` is the only tag guaranteed to exist for whichever
          # service(s) this run touched. `set -e` ensures a failed pull/up aborts the
          # script instead of falling through to the harmless final prune command,
          # which would otherwise report SSM/Actions status as Success either way.
          #
          # docker-compose.yml is rewritten from the repo on every run so the server
          # self-heals if /opt/todo-app is ever lost. .env holds real DB credentials,
          # so instead of being embedded here it's fetched by the *server's own* IAM
          # role from SSM Parameter Store (/todo-app/env-file, SecureString) — the
          # value never passes through this GitHub Actions run at all.
          compose_b64=$(base64 -w0 todo-api/docker/docker-compose.yml)

          # Onkosul kontrolleri en basta: sunucuda aws/docker yoksa 10 dakika
          # bekleyip anlamsiz bir hatayla dusmek yerine ilk saniyede net mesaj ver.
          # (Ubuntu AMI'lerinde AWS CLI hazir gelmez - bkz. ec2-user-data-ubuntu.sh)
          #
          # .env once .env.new'e yazilip sonra yerine konuyor: get-parameter
          # basarisiz olsa bile (yetki/parametre yok) dogrudan redirect calisan
          # .env'i sifirlar ve konteynerler bos kimlik bilgileriyle acilirdi.
          params=$(jq -n --arg compose "$compose_b64" --arg region "$AWS_REGION" '{
            commands: [
              "set -euo pipefail",
              "command -v aws    >/dev/null 2>&1 || { echo \"HATA: sunucuda AWS CLI yok, .env Parameter Store dan cekilemez\"; exit 1; }",
              "command -v docker >/dev/null 2>&1 || { echo \"HATA: sunucuda docker yok\"; exit 1; }",
              "docker compose version >/dev/null 2>&1 || { echo \"HATA: docker compose plugin yok\"; exit 1; }",
              "mkdir -p /opt/todo-app",
              ("echo " + $compose + " | base64 -d > /opt/todo-app/docker-compose.yml"),
              ("aws ssm get-parameter --name /todo-app/env-file --with-decryption --region " + $region + " --query Parameter.Value --output text > /opt/todo-app/.env.new"),
              "install -m 600 /opt/todo-app/.env.new /opt/todo-app/.env",
              "rm -f /opt/todo-app/.env.new",
              "cd /opt/todo-app",
              "docker compose pull --quiet",
              "docker compose up -d --remove-orphans --wait --wait-timeout 180",
              "docker compose ps",
              "docker image prune -f"
            ]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$params" \
            --comment "Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }}" \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $command_id"

          # Ilk sorgu ~2sn icinde InvocationDoesNotExist verebiliyor, o yuzden
          # hata ciktisi Pending'e dusuruluyor. 5sn'lik adimlar, toplam 10 dk:
          # bos bir sunucuda ilk `docker compose pull` (postgres + backend +
          # frontend) tek basina birkac dakika surebiliyor, eski 30x10sn=5dk
          # limiti bu yuzden deploy basarili olsa bile doluyordu.
          deadline=$(( SECONDS + 600 ))
          status="Pending"
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,ExitCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          if [ "$status" != "Success" ]; then
            echo "::error::SSM deploy komutu '$status' durumunda bitti (command id: $command_id). Yukaridaki Stderr ciktisina bak."
            exit 1
          fi
